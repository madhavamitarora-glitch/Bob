<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bob — Purdue Events</title>
<style>
  :root {
    color-scheme: light dark;
    --gold: #CFB991;
    --gold-dark: #8E6F3E;
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --card-border: #2c2c2c;
    --text: #f2f2f2;
    --text-dim: #a8a8a8;
    --high: #CFB991;
    --medium: #6f9bd1;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #faf9f7;
      --card: #ffffff;
      --card-border: #e5e0d8;
      --text: #1a1a1a;
      --text-dim: #5a5a5a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 0 0 3rem;
  }
  header {
    padding: 2rem 1.25rem 1rem;
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    margin: 0 0 0.15rem;
    font-size: 1.6rem;
    letter-spacing: -0.02em;
  }
  h1 span { color: var(--gold-dark); }
  .subtitle {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin: 0 0 1.1rem;
  }
  .controls {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  input[type="search"] {
    flex: 1 1 220px;
    padding: 0.55rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    font-size: 0.95rem;
  }
  select {
    padding: 0.55rem 0.6rem;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    font-size: 0.9rem;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 1.25rem;
  }
  .day-heading {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 1.6rem 0 0.5rem;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--card-border);
  }
  .day-heading:first-of-type { margin-top: 1rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    margin-bottom: 0.6rem;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: border-color 0.15s ease;
  }
  .card:hover { border-color: var(--gold-dark); }
  .card-top {
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    align-items: baseline;
  }
  .card-title {
    font-weight: 600;
    font-size: 0.98rem;
    line-height: 1.3;
  }
  .card-time {
    flex-shrink: 0;
    font-size: 0.82rem;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .card-location {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 0.2rem;
  }
  .tags {
    margin-top: 0.45rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
  }
  .tag {
    font-size: 0.72rem;
    padding: 0.12rem 0.5rem;
    border-radius: 999px;
    background: rgba(207, 185, 145, 0.15);
    color: var(--gold-dark);
    border: 1px solid rgba(207, 185, 145, 0.35);
  }
  .tag.medium {
    background: rgba(111, 155, 209, 0.12);
    color: var(--medium);
    border-color: rgba(111, 155, 209, 0.3);
  }
  .empty, .stale, .loading {
    color: var(--text-dim);
    text-align: center;
    padding: 3rem 1rem;
    font-size: 0.9rem;
  }
  .stale {
    background: rgba(200, 90, 60, 0.12);
    border: 1px solid rgba(200, 90, 60, 0.3);
    border-radius: 10px;
    padding: 0.8rem 1rem;
    margin: 1rem 0;
    color: #c85a3c;
    font-size: 0.85rem;
    text-align: left;
  }
  footer {
    max-width: 720px;
    margin: 2rem auto 0;
    padding: 0 1.25rem;
    color: var(--text-dim);
    font-size: 0.78rem;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Bob <span>— Purdue Events</span></h1>
  <p class="subtitle" id="subtitle">Loading…</p>
  <div class="controls">
    <input type="search" id="search" placeholder="Search events…">
    <select id="minScore">
      <option value="0">All events</option>
      <option value="1">Medium+ matches</option>
      <option value="3" selected>Notify-worthy (3+)</option>
    </select>
  </div>
</header>

<main id="main">
  <p class="loading">Loading events…</p>
</main>

<footer>
  Data from the public Purdue Localist feed, scored against a hand-tuned interest list. No LLM involved — plain matching, refreshed twice daily.
</footer>

<script>
const LOCAL_TZ = "America/New_York";
const STALE_AFTER_HOURS = 18;

function fmtDay(dateUtc) {
  return new Intl.DateTimeFormat("en-US", {
    weekday: "long", month: "short", day: "numeric", timeZone: LOCAL_TZ
  }).format(dateUtc);
}

function fmtTime(dateUtc) {
  return new Intl.DateTimeFormat("en-US", {
    hour: "numeric", minute: "2-digit", timeZone: LOCAL_TZ
  }).format(dateUtc).toLowerCase().replace(" ", "");
}

function render(data) {
  const main = document.getElementById("main");
  const subtitle = document.getElementById("subtitle");
  const search = document.getElementById("search").value.trim().toLowerCase();
  const minScore = parseFloat(document.getElementById("minScore").value);

  const events = data.events
    .filter(e => e.score >= minScore)
    .filter(e => !search ||
      e.title.toLowerCase().includes(search) ||
      (e.description || "").toLowerCase().includes(search) ||
      (e.location || "").toLowerCase().includes(search));

  subtitle.textContent = `${events.length} upcoming event${events.length === 1 ? "" : "s"}`;

  main.innerHTML = "";

  const genAt = new Date(data.generated_at);
  const ageHours = (Date.now() - genAt.getTime()) / 3600000;
  if (ageHours > STALE_AFTER_HOURS) {
    const stale = document.createElement("div");
    stale.className = "stale";
    stale.textContent = `Warning: this data was last refreshed ${Math.round(ageHours)}h ago. The poller may not have run recently — check the GitHub Actions tab.`;
    main.appendChild(stale);
  }

  if (events.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "Nothing matches right now.";
    main.appendChild(empty);
    return;
  }

  let lastDay = null;
  for (const ev of events) {
    if (ev.start_utc) {
      const start = new Date(ev.start_utc);
      const dayKey = fmtDay(start);
      if (dayKey !== lastDay) {
        const heading = document.createElement("div");
        heading.className = "day-heading";
        heading.textContent = dayKey;
        main.appendChild(heading);
        lastDay = dayKey;
      }
    }

    const card = document.createElement("a");
    card.className = "card";
    card.href = ev.url || "#";
    card.target = "_blank";
    card.rel = "noopener";

    const top = document.createElement("div");
    top.className = "card-top";

    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = ev.title;
    top.appendChild(title);

    if (ev.start_utc) {
      const time = document.createElement("div");
      time.className = "card-time";
      time.textContent = fmtTime(new Date(ev.start_utc));
      top.appendChild(time);
    }
    card.appendChild(top);

    if (ev.location) {
      const loc = document.createElement("div");
      loc.className = "card-location";
      loc.textContent = ev.location;
      card.appendChild(loc);
    }

    if (ev.matched_terms) {
      const tags = document.createElement("div");
      tags.className = "tags";
      ev.matched_terms.split(",").forEach(raw => {
        const t = raw.trim();
        if (!t || t.startsWith("mute:") || t.startsWith("deadline-proximity")) return;
        const tag = document.createElement("span");
        tag.className = "tag" + (t.startsWith("medium:") ? " medium" : "");
        tag.textContent = t.replace(/^high:|^medium:/, "");
        tags.appendChild(tag);
      });
      if (tags.children.length) card.appendChild(tags);
    }

    main.appendChild(card);
  }
}

let currentData = null;

fetch("events.json?_=" + Date.now())
  .then(r => {
    if (!r.ok) throw new Error("events.json not found");
    return r.json();
  })
  .then(data => {
    currentData = data;
    render(data);
  })
  .catch(err => {
    document.getElementById("main").innerHTML =
      `<p class="empty">Couldn't load events.json (${err.message}). The poller may not have run yet.</p>`;
    document.getElementById("subtitle").textContent = "";
  });

document.getElementById("search").addEventListener("input", () => currentData && render(currentData));
document.getElementById("minScore").addEventListener("change", () => currentData && render(currentData));
</script>

</body>
</html>
