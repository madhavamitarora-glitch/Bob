name: Poll Purdue events

on:
  schedule:
    # 11:00 and 21:00 UTC = ~7am and ~5pm Eastern (shifts an hour across DST)
    - cron: "0 11,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poller
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python poll.py

      - name: Commit updated events.db
        run: |
          git config user.name "bob-poller"
          git config user.email "bob-poller@users.noreply.github.com"
          git add events.db
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update events.db [skip ci]"
          git push
